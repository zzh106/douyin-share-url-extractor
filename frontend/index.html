<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>douyin-web-exporter - 抖音视频链接导出工具</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 抖音视频链接导出工具</h1>
            <p class="subtitle">提取用户所有公开视频的标题和链接</p>
        </header>

        <div class="input-section">
            <div class="input-group">
                <label for="userInput">请输入抖音用户主页 URL 或 sec_user_id：</label>
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="例如: https://www.douyin.com/user/xxx 或 MS4wLjABAAAA..."
                    autocomplete="off"
                >
            </div>
            <button id="fetchBtn" class="btn btn-primary">开始提取</button>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>正在提取视频列表，请稍候...</p>
        </div>

        <div id="error" class="error hidden"></div>

        <div id="resultSection" class="result-section hidden">
            <div class="result-header">
                <h2>提取结果</h2>
                <div class="result-info">
                    <span id="videoCount">0</span> 个视频
                </div>
                <button id="exportBtn" class="btn btn-export">📥 导出 TXT</button>
            </div>
            <div id="videoList" class="video-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
